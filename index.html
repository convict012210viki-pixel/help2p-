async function storageGetJSON(key, shared, fallback) {
  try {
    if (!window.storage) return fallback;
    const res = await window.storage.get(key, shared);
    if (!res || !res.value) return fallback;
    return JSON.parse(res.value);
  } catch (e) {
    return fallback;
  }
}
async function storageSetJSON(key, shared, value) {
  try {
    if (!window.storage) return false;
    const res = await window.storage.set(key, JSON.stringify(value), shared);
    return !!res;
  } catch (e) {
    return false;
  }
}

function timeGreeting(L_) {
  const h = new Date().getHours();
  if (h < 12) return L_.goodMorning;
  if (h < 18) return L_.goodAfternoon;
  return L_.goodEvening;
}

function Pill({ children, tone = "sage", style }) {
  const map = { sage: [C.sageSoft, C.sageDeep], rose: [C.roseSoft, C.roseDeep], lavender: [C.lavenderSoft, C.lavenderDeep], beige: [C.beigeSoft, C.inkSoft] };
  const [bg, fg] = map[tone] || map.sage;
  return (
    <span style={{ background: bg, color: fg, fontSize: 12, fontWeight: 600, padding: "4px 10px", borderRadius: 999, display: "inline-flex", alignItems: "center", gap: 4, ...style }}>
      {children}
    </span>
  );
}

function ReviewBadge({ status, lang }) {
  const t = L[lang];
  return status === "approved" ? (
    <Pill tone="sage"><BadgeCheck size={12} /> {t.reviewedBadge}</Pill>
  ) : (
    <Pill tone="beige"><Clock size={12} /> {t.pendingBadge}</Pill>
  );
}

function PrimaryButton({ children, onClick, style, disabled, accent = C.ink }) {
  return (
    <button
      onClick={onClick}
      disabled={disabled}
      style={{
        background: disabled ? C.inkFaint : accent, color: "#fff", border: "none",
        borderRadius: 999, padding: "14px 20px", fontSize: 15, fontWeight: 600,
        width: "100%", cursor: disabled ? "default" : "pointer", transition: "opacity .15s",
        ...style,
      }}
    >
      {children}
    </button>
  );
}

function GhostButton({ children, onClick, style }) {
  return (
    <button onClick={onClick} style={{ background: "transparent", border: "none", color: C.inkSoft, fontSize: 14, fontWeight: 600, cursor: "pointer", padding: "8px 4px", ...style }}>
      {children}
    </button>
  );
}

function Field({ label, error, children }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <label style={{ display: "block", fontSize: 13, fontWeight: 600, color: C.inkSoft, marginBottom: 6 }}>{label}</label>
      {children}
      {error && <div style={{ color: C.warn, fontSize: 12, marginTop: 5 }}>{error}</div>}
    </div>
  );
}

function inputStyle(error) {
  return {
    width: "100%", padding: "13px 14px", borderRadius: 14, border: `1.5px solid ${error ? C.warn : C.line}`,
    background: C.card, fontSize: 15, color: C.ink, outline: "none", boxSizing: "border-box", fontFamily: "inherit",
  };
}

function Card({ children, style, onClick }) {
  return (
    <div onClick={onClick} style={{ background: C.card, borderRadius: 22, padding: 18, boxShadow: "0 2px 14px rgba(46,42,38,0.05)", cursor: onClick ? "pointer" : "default", ...style }}>
      {children}
    </div>
  );
}

function SectionTitle({ children, action }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", margin: "22px 2px 10px" }}>
      <h3 style={{ fontFamily: "Fraunces, serif", fontSize: 19, fontWeight: 600, color: C.ink, margin: 0 }}>{children}</h3>
      {action}
    </div>
  );
}

/* ============================================================
   MAIN APP
   ============================================================ */
function RowaaApp() {
  const [lang, setLang] = useState("en");
  const [screen, setScreen] = useState("splash");
  const [authMode, setAuthMode] = useState("signup");
  const [journey, setJourney] = useState(null);
  const [activeTab, setActiveTab] = useState("home");
  const [user, setUser] = useState(null);
  const [journalEntries, setJournalEntries] = useState([]);
  const [myQuestions, setMyQuestions] = useState([
    { id: "q1", cat: "feeding", text: { en: "How many ml is my baby taking per feed?", ar: "طفلي بياخد قد إيه (مل) كل رضعة؟" }, answered: false },
  ]);
  const [selectedStage, setSelectedStage] = useState(null);
  const [selectedArticle, setSelectedArticle] = useState(null);
  const [articleCatFilter, setArticleCatFilter] = useState("all");
  const [articleSearch, setArticleSearch] = useState("");
  const [notif, setNotif] = useState({ appointments: true, tips: true, journal: false });

  const [ownerEmail, setOwnerEmailState] = useState(OWNER_DEFAULT_EMAIL);
  const [broadcasts, setBroadcasts] = useState([]);
  const [ownerInbox, setOwnerInbox] = useState([]);
  const [showNotif, setShowNotif] = useState(false);
  const [lastSeenTs, setLastSeenTs] = useState(0);
  const [deferredInstall, setDeferredInstall] = useState(null);
  const [installToast, setInstallToast] = useState("");

  useEffect(() => {
    function onBeforeInstall(e) {
      e.preventDefault();
      setDeferredInstall(e);
    }
    window.addEventListener("beforeinstallprompt", onBeforeInstall);
    return () => window.removeEventListener("beforeinstallprompt", onBeforeInstall);
  }, []);

  async function handleInstallClick() {
    if (deferredInstall) {
      deferredInstall.prompt();
      await deferredInstall.userChoice;
      setDeferredInstall(null);
    } else {
      setInstallToast(t.installHint);
      setTimeout(() => setInstallToast(""), 3200);
    }
  }

  const t = L[lang];
  const dir = lang === "ar" ? "rtl" : "ltr";
  const Fwd = dir === "rtl" ? ChevronLeft : ChevronRight;
  const Back = dir === "rtl" ? ArrowRight : ArrowLeft;
  const theme = JOURNEY_THEME[journey || "home"];
  const isOwner = !!(user && user.email && ownerEmail && user.email.trim().toLowerCase() === ownerEmail.trim().toLowerCase());
  const unreadCount = broadcasts.filter((b) => new Date(b.date).getTime() > lastSeenTs).length + (isOwner ? ownerInbox.length : 0);

  useEffect(() => {
    const timer = setTimeout(() => { if (screen === "splash") setScreen("welcome"); }, 1400);
    return () => clearTimeout(timer);
  }, [screen]);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      const cfg = await storageGetJSON("owner-config", true, { email: OWNER_DEFAULT_EMAIL });
      if (!cancelled) setOwnerEmailState(cfg.email || OWNER_DEFAULT_EMAIL);
      const b = await storageGetJSON("broadcasts", true, []);
      if (!cancelled) setBroadcasts(b);
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (screen !== "app") return;
    const iv = setInterval(async () => {
      const b = await storageGetJSON("broadcasts", true, []);
      setBroadcasts(b);
      if (isOwner) {
        const oi = await storageGetJSON("owner-inbox", true, []);
        setOwnerInbox(oi);
      }
    }, 6000);
    return () => clearInterval(iv);
  }, [screen, isOwner]);

  useEffect(() => {
    if (!isOwner) return;
    (async () => {
      const oi = await storageGetJSON("owner-inbox", true, []);
      setOwnerInbox(oi);
    })();
  }, [isOwner]);

  async function sendBroadcast(title, text) {
    const item = { id: "b" + Date.now(), title, text, date: new Date().toISOString() };
    const updated = [item, ...broadcasts].slice(0, 30);
    const ok = await storageSetJSON("broadcasts", true, updated);
    if (ok) setBroadcasts(updated);
    return ok;
  }
  async function sendToOwner(text) {
    const item = { id: "m" + Date.now(), from: user?.name || "—", phone: user?.phone || "", text, date: new Date().toISOString() };
    const current = await storageGetJSON("owner-inbox", true, []);
    const updated = [item, ...current].slice(0, 50);
    const ok = await storageSetJSON("owner-inbox", true, updated);
    if (ok && isOwner) setOwnerInbox(updated);
    return ok;
  }
  async function updateOwnerEmail(newEmail) {
    const ok = await storageSetJSON("owner-config", true, { email: newEmail });
    if (ok) setOwnerEmailState(newEmail);
    return ok;
  }

  const fontStyle = (
    <style>{`
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
      * { box-sizing: border-box; }
      .rowaa-root { font-family: ${lang === "ar" ? "'IBM Plex Sans Arabic'" : "'Inter'"}, sans-serif; }
      .rowaa-serif { font-family: 'Fraunces', serif; }
      .rowaa-scroll::-webkit-scrollbar { display: none; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }
      .fade-in { animation: fadeIn .35s ease; }
      @media (prefers-reduced-motion: reduce) { .fade-in { animation: none; } }
      button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 2px solid ${C.lavenderDeep}; outline-offset: 2px; }
    `}</style>
  );

  /* ---------- SPLASH ---------- */
  if (screen === "splash") {
    return (
      <div dir={dir} className="rowaa-root" style={{ minHeight: 560, background: `linear-gradient(160deg, ${C.roseSoft}, ${C.ivory} 60%)`, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", borderRadius: 28, position: "relative", overflow: "hidden" }}>
        {fontStyle}
        <div className="fade-in" style={{ textAlign: "center" }}>
          <div style={{ width: 112, height: 112, borderRadius: "50%", background: C.card, display: "flex", alignItems: "center", justifyContent: "center", margin: "0 auto 18px", boxShadow: "0 6px 24px rgba(189,129,119,0.25)" }}>
            <Help2PMark size={100} />
          </div>
          <div className="rowaa-serif" style={{ fontSize: 30, color: C.ink, fontWeight: 600 }}>{t.appName}</div>
          <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 6 }}>{t.loading}</div>
        </div>
      </div>
    );
  }

  /* ---------- WELCOME ---------- */
  if (screen === "welcome") {
    return (
      <Shell dir={dir}>
        {fontStyle}
        <div className="fade-in" style={{ padding: "36px 22px", minHeight: 560, display: "flex", flexDirection: "column" }}>
          <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 30 }}>
            <LangToggle lang={lang} setLang={setLang} />
          </div>
          <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", textAlign: "center" }}>
            <div style={{ width: 132, height: 132, borderRadius: "50%", background: C.roseSoft, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 22 }}>
              <Help2PMark size={118} />
            </div>
            <div className="rowaa-serif" style={{ fontSize: 32, fontWeight: 600, color: C.ink, marginBottom: 10 }}>{t.appName}</div>
            <div style={{ fontSize: 15, color: C.inkSoft, maxWidth: 260, lineHeight: 1.6, marginBottom: 14 }}>{t.tagline}</div>
            <button onClick={handleInstallClick} style={{ display: "flex", alignItems: "center", gap: 6, background: "transparent", border: `1.5px solid ${C.line}`, borderRadius: 999, padding: "7px 16px", fontSize: 12.5, fontWeight: 700, color: C.inkSoft, cursor: "pointer" }}>
              <Plus size={13} /> {t.install}
            </button>
            {installToast && <div style={{ fontSize: 11.5, color: C.inkFaint, marginTop: 8, maxWidth: 240 }}>{installToast}</div>}
          </div>
          <div>
            <PrimaryButton accent={C.roseDeep} onClick={() => { setAuthMode("signup"); setScreen("auth"); }}>{t.getStarted}</PrimaryButton>
            <GhostButton style={{ width: "100%", textAlign: "center", marginTop: 8 }} onClick={() => { setAuthMode("login"); setScreen("auth"); }}>{t.haveAccount}</GhostButton>
          </div>
        </div>
      </Shell>
    );
  }

  /* ---------- AUTH ---------- */
  if (screen === "auth") {
    return <AuthScreen dir={dir} t={t} lang={lang} setLang={setLang} mode={authMode} setMode={setAuthMode}
      fontStyle={fontStyle}
      onDone={(u) => { setUser(u); setScreen("onboarding"); }}
      onForgot={() => setScreen("forgot")} />;
  }
  if (screen === "forgot") {
    return <ForgotScreen dir={dir} t={t} fontStyle={fontStyle} onBack={() => setScreen("auth")} />;
  }

  /* ---------- ONBOARDING ---------- */
  if (screen === "onboarding") {
    return (
      <Shell dir={dir}>
        {fontStyle}
        <div className="fade-in" style={{ padding: "40px 22px", minHeight: 560, display: "flex", flexDirection: "column" }}>
          <Sparkles color={C.roseDeep} size={26} />
          <h2 className="rowaa-serif" style={{ fontSize: 24, marginTop: 14, marginBottom: 6, color: C.ink }}>{t.onboardTitle}</h2>
          <p style={{ color: C.inkSoft, fontSize: 14, marginBottom: 26, lineHeight: 1.6 }}>{t.onboardSubtitle}</p>
          <div style={{ display: "flex", flexDirection: "column", gap: 12, flex: 1 }}>
            <JourneyOption icon={Heart} title={t.nicuTitle} desc={t.nicuDesc} tone="rose" onClick={() => { setJourney("nicu"); setScreen("app"); }} />
            <JourneyOption icon={Sunrise} title={t.homeTitle} desc={t.homeDesc} tone="sage" onClick={() => { setJourney("home"); setScreen("app"); }} />
            <JourneyOption icon={Feather} title={t.lossTitle} desc={t.lossDesc} tone="lavender" onClick={() => { setJourney("loss"); setScreen("app"); }} />
            <JourneyOption icon={Clock} title={t.laterTitle} desc={t.laterDesc} tone="beige" onClick={() => { setJourney("home"); setScreen("app"); }} />
          </div>
        </div>
      </Shell>
    );
  }

  /* ---------- MAIN APP ---------- */
  return (
    <Shell dir={dir}>
      {fontStyle}
      <div className="rowaa-scroll" style={{ minHeight: 560, maxHeight: 640, overflowY: "auto", paddingBottom: 90 }}>
        {activeTab === "home" && !showNotif && (
          <HomeTab t={t} lang={lang} journey={journey} theme={theme} user={user}
            journalEntries={journalEntries} myQuestions={myQuestions}
            onOpenStage={(s) => { setActiveTab("journey"); setSelectedStage(s); }}
            onGoTools={() => setActiveTab("tools")} onGoJournal={() => setActiveTab("tools")} Fwd={Fwd}
            unreadCount={unreadCount} onOpenNotif={() => { setShowNotif(true); setLastSeenTs(Date.now()); }} />
        )}
        {showNotif && (
          <NotificationsPanel t={t} lang={lang} theme={theme} isOwner={isOwner}
            broadcasts={broadcasts} ownerInbox={ownerInbox} ownerEmail={ownerEmail}
            onBack={() => setShowNotif(false)}
            onSendBroadcast={sendBroadcast} onSendToOwner={sendToOwner} onUpdateOwnerEmail={updateOwnerEmail} />
        )}
        {activeTab === "journey" && (
          <JourneyTab t={t} lang={lang} journey={journey} theme={theme}
            selectedStage={selectedStage} setSelectedStage={setSelectedStage} Fwd={Fwd} />
        )}
        {activeTab === "learn" && (
          <LearnTab t={t} lang={lang} theme={theme} journey={journey}
            selectedArticle={selectedArticle} setSelectedArticle={setSelectedArticle}
            catFilter={articleCatFilter} setCatFilter={setArticleCatFilter}
            search={articleSearch} setSearch={setArticleSearch} Fwd={Fwd} />
        )}
        {activeTab === "tools" && (
          <ToolsTab t={t} lang={lang} theme={theme} journey={journey}
            myQuestions={myQuestions} setMyQuestions={setMyQuestions}
            journalEntries={journalEntries} setJournalEntries={setJournalEntries} Fwd={Fwd} />
        )}
        {activeTab === "profile" && (
          <ProfileTab t={t} lang={lang} setLang={setLang} journey={journey} setJourney={setJourney} isOwner={isOwner}
            theme={theme} notif={notif} setNotif={setNotif} user={user}
            onLogout={() => { setUser(null); setJourney(null); setScreen("welcome"); setActiveTab("home"); }} />
        )}
      </div>
      <BottomNav t={t} active={activeTab} setActive={setActiveTab} theme={theme} dir={dir} />
    </Shell>
  );
}

/* ============================================================
   SHELL / NAV / LOGO
   ============================================================ */
function Shell({ children, dir }) {
  return (
    <div dir={dir} className="rowaa-root" style={{ position: "relative", maxWidth: 420, margin: "0 auto", background: C.ivory, borderRadius: 28, minHeight: 560, overflow: "hidden", boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
      {children}
    </div>
  );
}

function Help2PMark({ size = 32 }) {
  return (
    <img
      src={"data:image/jpeg;base64," + HELP2P_LOGO_B64}
      alt="help2p"
      style={{ width: size, height: size, objectFit: "cover", borderRadius: "50%", display: "block" }}
    />
  );
}

function LangToggle({ lang, setLang }) {
  return (
    <button onClick={() => setLang(lang === "en" ? "ar" : "en")} style={{ display: "flex", alignItems: "center", gap: 6, background: C.card, border: `1px solid ${C.line}`, borderRadius: 999, padding: "7px 13px", fontSize: 13, fontWeight: 600, color: C.ink, cursor: "pointer" }}>
      <Globe size={14} /> {lang === "en" ? "العربية" : "English"}
    </button>
  );
}

function JourneyOption({ icon: Icon, title, desc, tone, onClick }) {
  const map = { rose: [C.roseSoft, C.roseDeep], sage: [C.sageSoft, C.sageDeep], lavender: [C.lavenderSoft, C.lavenderDeep], beige: [C.beigeSoft, C.inkSoft] };
  const [bg, fg] = map[tone];
  return (
    <button onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 14, textAlign: "start", background: C.card, border: `1.5px solid ${C.line}`, borderRadius: 20, padding: 16, cursor: "pointer", width: "100%" }}>
      <div style={{ width: 44, height: 44, minWidth: 44, borderRadius: 14, background: bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Icon size={20} color={fg} />
      </div>
      <div>
        <div style={{ fontWeight: 700, fontSize: 15, color: C.ink }}>{title}</div>
        <div style={{ fontSize: 12.5, color: C.inkSoft, marginTop: 2 }}>{desc}</div>
      </div>
    </button>
  );
}

function BottomNav({ t, active, setActive, theme, dir }) {
  const items = [
    { id: "home", icon: HomeIcon, label: t.navHome },
    { id: "journey", icon: Route, label: t.navJourney },
    { id: "learn", icon: BookOpen, label: t.navLearn },
    { id: "tools", icon: Wrench, label: t.navTools },
    { id: "profile", icon: User, label: t.navProfile },
  ];
  return (
    <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, background: C.card, borderTop: `1px solid ${C.line}`, display: "flex", padding: "8px 6px calc(env(safe-area-inset-bottom, 6px))", direction: dir }}>
      {items.map((it) => {
        const isActive = active === it.id;
        return (
          <button key={it.id} onClick={() => setActive(it.id)} style={{ flex: 1, background: "none", border: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "6px 2px", cursor: "pointer" }}>
            <it.icon size={20} color={isActive ? theme.deep : C.inkFaint} strokeWidth={isActive ? 2.4 : 2} />
            <span style={{ fontSize: 10.5, fontWeight: isActive ? 700 : 500, color: isActive ? theme.deep : C.inkFaint }}>{it.label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ============================================================
   AUTH + FORGOT SCREENS
   ============================================================ */
function AuthScreen({ dir, t, lang, setLang, mode, setMode, onDone, onForgot, fontStyle }) {
  const [form, setForm] = useState({ name: "", phone: "", password: "", confirm: "", email: "", agree: false, remember: false });
  const [errors, setErrors] = useState({});

  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }

  function validate() {
    const e = {};
    if (mode === "signup" && !form.name.trim()) e.name = t.required;
    if (!form.phone.trim() || form.phone.replace(/\D/g, "").length < 8) e.phone = t.phoneInvalid;
    if (!form.password || form.password.length < 6) e.password = t.required;
    if (mode === "signup" && form.password !== form.confirm) e.confirm = t.passwordMismatch;
    if (mode === "signup" && !form.agree) e.agree = t.termsRequired;
    setErrors(e);
    return Object.keys(e).length === 0;
  }

  function submit() {
    if (!validate()) return;
    onDone({ name: form.name || "Sara", phone: form.phone, email: form.email || "" });
  }

  return (
    <Shell dir={dir}>
      {fontStyle}
      <div className="fade-in rowaa-scroll" style={{ padding: "26px 22px", minHeight: 560, maxHeight: 640, overflowY: "auto" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 22 }}>
          <Help2PMark size={48} />
          <LangToggle lang={lang} setLang={setLang} />
        </div>
        <h2 className="rowaa-serif" style={{ fontSize: 25, color: C.ink, marginBottom: 4 }}>{mode === "signup" ? t.signUp : t.welcomeBack}</h2>
        <div style={{ display: "flex", gap: 18, marginBottom: 22, borderBottom: `1px solid ${C.line}` }}>
          {["signup", "login"].map((m) => (
            <button key={m} onClick={() => { setMode(m); setErrors({}); }} style={{ background: "none", border: "none", padding: "8px 2px", cursor: "pointer", fontSize: 14, fontWeight: 700, color: mode === m ? C.roseDeep : C.inkFaint, borderBottom: mode === m ? `2px solid ${C.roseDeep}` : "2px solid transparent" }}>
              {m === "signup" ? t.signUp : t.logIn}
            </button>
          ))}
        </div>

        {mode === "signup" && (
          <Field label={t.fullName} error={errors.name}>
            <input style={inputStyle(errors.name)} placeholder={t.yourName} value={form.name} onChange={(e) => set("name", e.target.value)} />
          </Field>
        )}
        <Field label={t.phone} error={errors.phone}>
          <input style={inputStyle(errors.phone)} placeholder={t.yourPhone} value={form.phone} onChange={(e) => set("phone", e.target.value)} inputMode="tel" />
        </Field>
        <Field label={t.emailOptional}>
          <input style={inputStyle()} value={form.email} onChange={(e) => set("email", e.target.value)} autoCapitalize="none" />
        </Field>
        <Field label={t.password} error={errors.password}>
          <input type="password" style={inputStyle(errors.password)} value={form.password} onChange={(e) => set("password", e.target.value)} />
        </Field>
        {mode === "signup" && (
          <Field label={t.confirmPassword} error={errors.confirm}>
            <input type="password" style={inputStyle(errors.confirm)} value={form.confirm} onChange={(e) => set("confirm", e.target.value)} />
          </Field>
        )}

        {mode === "signup" ? (
          <label style={{ display: "flex", alignItems: "flex-start", gap: 8, fontSize: 13, color: C.inkSoft, marginBottom: 20, cursor: "pointer" }}>
            <input type="checkbox" checked={form.agree} onChange={(e) => set("agree", e.target.checked)} style={{ marginTop: 2 }} />
            {t.agreeTerms}
          </label>
        ) : (
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
            <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 13, color: C.inkSoft, cursor: "pointer" }}>
              <input type="checkbox" checked={form.remember} onChange={(e) => set("remember", e.target.checked)} /> {t.rememberMe}
            </label>
            <GhostButton onClick={onForgot} style={{ padding: 0, color: C.roseDeep }}>{t.forgotPassword}</GhostButton>
          </div>
        )}
        {errors.agree && <div style={{ color: C.warn, fontSize: 12, marginBottom: 10 }}>{errors.agree}</div>}

        <PrimaryButton accent={C.roseDeep} onClick={submit}>{mode === "signup" ? t.createAccount : t.logIn}</PrimaryButton>
      </div>
    </Shell>
  );
}

function ForgotScreen({ dir, t, onBack, fontStyle }) {
  const [phone, setPhone] = useState("");
  const [sent, setSent] = useState(false);
  return (
    <Shell dir={dir}>
      {fontStyle}
      <div className="fade-in" style={{ padding: "26px 22px", minHeight: 560 }}>
        <GhostButton onClick={onBack} style={{ padding: 0, marginBottom: 18 }}>← {t.back}</GhostButton>
        <h2 className="rowaa-serif" style={{ fontSize: 23, color: C.ink, marginBottom: 8 }}>{t.resetPassword}</h2>
        <p style={{ fontSize: 14, color: C.inkSoft, marginBottom: 22, lineHeight: 1.6 }}>{t.resetHelp}</p>
        {!sent ? (
          <>
            <Field label={t.phone}><input style={inputStyle()} value={phone} onChange={(e) => setPhone(e.target.value)} /></Field>
            <PrimaryButton accent={C.roseDeep} onClick={() => setSent(true)} disabled={!phone.trim()}>{t.sendResetLink}</PrimaryButton>
          </>
        ) : (
          <Card style={{ background: C.sageSoft, textAlign: "center" }}>
            <Check color={C.sageDeep} style={{ margin: "0 auto 8px" }} />
            <div style={{ fontSize: 14, color: C.ink }}>{t.resetHelp}</div>
            <GhostButton onClick={onBack} style={{ marginTop: 10 }}>{t.backToLogin}</GhostButton>
          </Card>
        )}
      </div>
    </Shell>
  );
}

/* ============================================================

function CorrectedAgeCalc({ t, lang, theme, onBack }) {
  const Back = lang === "ar" ? ArrowRight : ArrowLeft;
  const [birth, setBirth] = useState("");
  const [due, setDue] = useState("");
  const [result, setResult] = useState(null);

  function calc() {
    if (!birth || !due) return;
    const b = new Date(birth), d = new Date(due), now = new Date();
    const gestWeeksAtBirth = 40 - Math.round((d - b) / (1000 * 60 * 60 * 24 * 7));
    const chronoDays = Math.round((now - b) / (1000 * 60 * 60 * 24));
    const prematureDays = Math.round((d - b) / (1000 * 60 * 60 * 24));
    const correctedDays = Math.max(0, chronoDays - prematureDays);
    setResult({
      chronoWeeks: Math.floor(chronoDays / 7), chronoRemDays: chronoDays % 7,
      correctedWeeks: Math.floor(correctedDays / 7), correctedRemDays: correctedDays % 7,
      gestWeeksAtBirth,
    });
  }

  return (
    <div className="fade-in" style={{ padding: "22px 20px 30px" }}>
      <GhostButton onClick={onBack} style={{ padding: 0, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}><Back size={15} /> {t.back}</GhostButton>
      <h2 className="rowaa-serif" style={{ fontSize: 21, color: C.ink }}>{t.correctedAgeTool}</h2>
      <p style={{ fontSize: 13, color: C.inkSoft, marginTop: 6, marginBottom: 20, lineHeight: 1.6 }}>{t.correctedAgeDesc}</p>

      <Field label={t.birthDate}><input type="date" style={inputStyle()} value={birth} onChange={(e) => setBirth(e.target.value)} /></Field>
      <Field label={t.dueDate}><input type="date" style={inputStyle()} value={due} onChange={(e) => setDue(e.target.value)} /></Field>
      <PrimaryButton accent={theme.deep} onClick={calc} disabled={!birth || !due}>{t.calculate}</PrimaryButton>

      {result && (
        <Card style={{ marginTop: 20, background: theme.soft }}>
          <div style={{ display: "flex", justifyContent: "space-between" }}>
            <div>
              <div style={{ fontSize: 12, color: C.inkSoft }}>{t.correctedAgeResult}</div>
              <div style={{ fontWeight: 700, fontSize: 20, color: theme.deep }}>{result.correctedWeeks}{t.weeks[0]} {result.correctedRemDays}{t.days[0]}</div>
            </div>
            <div>
              <div style={{ fontSize: 12, color: C.inkSoft }}>{t.chronoAgeResult}</div>
              <div style={{ fontWeight: 700, fontSize: 20, color: C.ink }}>{result.chronoWeeks}{t.weeks[0]} {result.chronoRemDays}{t.days[0]}</div>
            </div>
          </div>
          <div style={{ fontSize: 11.5, color: C.inkSoft, marginTop: 10 }}>{t.gestAge}: {result.gestWeeksAtBirth} {t.weeks}</div>
        </Card>
      )}
      <Disclaimer t={t} />
    </div>
  );
}

function DoctorQuestions({ t, lang, theme, myQuestions, setMyQuestions, onBack }) {
  const Back = lang === "ar" ? ArrowRight : ArrowLeft;
  const [text, setText] = useState("");
  const [cat, setCat] = useState("feeding");

  function add() {
    if (!text.trim()) return;
    setMyQuestions((qs) => [...qs, { id: "q" + Date.now(), cat, text: { en: text, ar: text }, answered: false }]);
    setText("");
  }
  function toggle(id) {
    setMyQuestions((qs) => qs.map((q) => (q.id === id ? { ...q, answered: !q.answered } : q)));
  }

  return (
    <div className="fade-in" style={{ padding: "22px 20px 30px" }}>
      <GhostButton onClick={onBack} style={{ padding: 0, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}><Back size={15} /> {t.back}</GhostButton>
      <h2 className="rowaa-serif" style={{ fontSize: 21, color: C.ink, marginBottom: 16 }}>{t.careTeamQuestions}</h2>

      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
        <input value={text} onChange={(e) => setText(e.target.value)} placeholder={t.addQuestion} style={{ ...inputStyle(), flex: 1 }} />
        <button onClick={add} style={{ background: theme.deep, border: "none", borderRadius: 14, width: 46, color: "#fff", cursor: "pointer" }}><Plus size={18} style={{ margin: "auto" }} /></button>
      </div>

      <div style={{ fontWeight: 700, fontSize: 13, color: C.ink, marginBottom: 8 }}>{t.myQuestions}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 20 }}>
        {myQuestions.map((q) => (
          <Card key={q.id} style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <button onClick={() => toggle(q.id)} style={{ width: 22, height: 22, minWidth: 22, borderRadius: "50%", border: `2px solid ${q.answered ? C.sageDeep : C.line}`, background: q.answered ? C.sageDeep : "transparent", display: "flex", alignItems: "center", justifyContent: "center", cursor: "pointer" }}>
              {q.answered && <Check size={12} color="#fff" />}
            </button>
            <div style={{ flex: 1, fontSize: 13.5, color: q.answered ? C.inkFaint : C.ink, textDecoration: q.answered ? "line-through" : "none" }}>{q.text[lang]}</div>
          </Card>
        ))}
      </div>

      <div style={{ fontWeight: 700, fontSize: 13, color: C.ink, marginBottom: 8 }}>{t.suggested}</div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {SUGGESTED_QUESTIONS.map((q, i) => (
          <Card key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ fontSize: 13, color: C.ink, flex: 1 }}>{q[lang]}</div>
            <button onClick={() => setMyQuestions((qs) => [...qs, { id: "q" + Date.now() + i, cat: q.cat, text: { en: q.en, ar: q.ar }, answered: false }])} style={{ background: "none", border: `1.5px solid ${theme.deep}`, borderRadius: 999, width: 26, height: 26, color: theme.deep, cursor: "pointer" }}>+</button>
          </Card>
        ))}
      </div>
    </div>
  );
}

function JournalTool({ t, lang, theme, journey, entries, setEntries, onBack }) {
  const Back = lang === "ar" ? ArrowRight : ArrowLeft;
  const [showForm, setShowForm] = useState(false);
  const [title, setTitle] = useState("");
  const [text, setText] = useState("");

  function save() {
    if (!text.trim()) return;
    setEntries((e) => [{ id: Date.now(), title: title || (lang === "ar" ? "بلا عنوان" : "Untitled"), text, date: new Date().toLocaleDateString(lang === "ar" ? "ar-EG" : "en-US") }, ...e]);
    setTitle(""); setText(""); setShowForm(false);
  }

  const label = journey === "loss" ? t.remembrance : t.journal;

  return (
    <div className="fade-in" style={{ padding: "22px 20px 30px" }}>
      <GhostButton onClick={onBack} style={{ padding: 0, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}><Back size={15} /> {t.back}</GhostButton>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
        <h2 className="rowaa-serif" style={{ fontSize: 21, color: C.ink, margin: 0 }}>{label}</h2>
        {!showForm && <GhostButton onClick={() => setShowForm(true)} style={{ padding: 0, color: theme.deep }}>+ {t.newEntry}</GhostButton>}
      </div>

      {showForm && (
        <Card style={{ marginBottom: 18 }}>
          <Field label={t.entryTitle}><input style={inputStyle()} value={title} onChange={(e) => setTitle(e.target.value)} /></Field>
          <Field label={t.entryText}><textarea style={{ ...inputStyle(), minHeight: 90, resize: "vertical" }} value={text} onChange={(e) => setText(e.target.value)} /></Field>
          <div style={{ display: "flex", gap: 8 }}>
            <PrimaryButton accent={theme.deep} onClick={save} style={{ flex: 1 }}>{t.save}</PrimaryButton>
            <GhostButton onClick={() => setShowForm(false)}>{t.cancel}</GhostButton>
          </div>
        </Card>
      )}

      {entries.length === 0 && !showForm ? (
        <Card style={{ textAlign: "center", padding: 30 }}>
          <Feather size={22} color={theme.deep} style={{ margin: "0 auto 10px" }} />
          <div style={{ fontSize: 13.5, color: C.inkSoft, lineHeight: 1.6 }}>{t.noEntriesYet}</div>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {entries.map((e) => (
            <Card key={e.id}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <div style={{ fontWeight: 700, fontSize: 14, color: C.ink }}>{e.title}</div>
                <div style={{ fontSize: 11, color: C.inkFaint }}>{e.date}</div>
              </div>
              <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 6, lineHeight: 1.6 }}>{e.text}</div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   NOTIFICATIONS PANEL — broadcasts from the owner to everyone,
   plus (owner-only) a compose box and inbox of user messages.
   ============================================================ */
function NotificationsPanel({ t, lang, theme, isOwner, broadcasts, ownerInbox, ownerEmail, onBack, onSendBroadcast, onSendToOwner, onUpdateOwnerEmail }) {
  const Back = lang === "ar" ? ArrowRight : ArrowLeft;
  const [bTitle, setBTitle] = useState("");
  const [bText, setBText] = useState("");
  const [myMsg, setMyMsg] = useState("");
  const [emailDraft, setEmailDraft] = useState(ownerEmail);
  const [toast, setToast] = useState("");

  function flash(msg) { setToast(msg); setTimeout(() => setToast(""), 2200); }

  async function doSendBroadcast() {
    if (!bText.trim()) return;
    await onSendBroadcast(bTitle.trim() || t.notifPanelTitle, bText.trim());
    setBTitle(""); setBText("");
  }
  async function doSendToOwner() {
    if (!myMsg.trim()) return;
    await onSendToOwner(myMsg.trim());
    setMyMsg("");
    flash(t.messageSentToast);
  }
  async function doSaveEmail() {
    if (!emailDraft.trim()) return;
    await onUpdateOwnerEmail(emailDraft.trim());
    flash(t.emailSaved);
  }

  return (
    <div className="fade-in" style={{ padding: "22px 20px 30px" }}>
      <GhostButton onClick={onBack} style={{ padding: 0, marginBottom: 14, display: "flex", alignItems: "center", gap: 6 }}><Back size={15} /> {t.back}</GhostButton>
      <h2 className="rowaa-serif" style={{ fontSize: 21, color: C.ink, margin: "0 0 16px" }}>{t.notifPanelTitle}</h2>

      {toast && <Card style={{ background: theme.soft, marginBottom: 14, padding: 12, textAlign: "center", fontSize: 13, color: theme.deep, fontWeight: 600 }}>{toast}</Card>}

      {isOwner && (
        <>
          <div style={{ fontSize: 12, fontWeight: 700, color: C.inkFaint, textTransform: "uppercase", letterSpacing: 0.3, marginBottom: 8 }}>{t.ownerTools}</div>
          <Card style={{ marginBottom: 14 }}>
            <Field label={t.composeBroadcast}>
              <input style={{ ...inputStyle(), marginBottom: 8 }} placeholder={t.broadcastTitlePh} value={bTitle} onChange={(e) => setBTitle(e.target.value)} />
              <textarea style={{ ...inputStyle(), minHeight: 70, resize: "vertical" }} placeholder={t.broadcastTextPh} value={bText} onChange={(e) => setBText(e.target.value)} />
            </Field>
            <PrimaryButton accent={theme.deep} onClick={doSendBroadcast}>{t.sendToAll}</PrimaryButton>
          </Card>

          <Card style={{ marginBottom: 14 }}>
            <Field label={t.ownerEmailLabel}>
              <div style={{ display: "flex", gap: 8 }}>
                <input style={{ ...inputStyle(), flex: 1 }} value={emailDraft} onChange={(e) => setEmailDraft(e.target.value)} autoCapitalize="none" />
                <button onClick={doSaveEmail} style={{ background: theme.deep, color: "#fff", border: "none", borderRadius: 14, padding: "0 18px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>{t.saveEmail}</button>
              </div>
            </Field>
          </Card>

          <SectionTitle>{t.messagesFromUsers}</SectionTitle>
          {ownerInbox.length === 0 ? (
            <Card style={{ textAlign: "center", padding: 24, marginBottom: 10 }}>
              <div style={{ fontSize: 13, color: C.inkSoft }}>{t.noUserMessages}</div>
            </Card>
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 10 }}>
              {ownerInbox.map((m) => (
                <Card key={m.id}>
                  <div style={{ display: "flex", justifyContent: "space-between" }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: C.ink }}>{m.from}{m.phone ? ` · ${m.phone}` : ""}</div>
                    <div style={{ fontSize: 11, color: C.inkFaint }}>{new Date(m.date).toLocaleString(lang === "ar" ? "ar-EG" : "en-US")}</div>
                  </div>
                  <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 6, lineHeight: 1.6 }}>{m.text}</div>
                </Card>
              ))}
            </div>
          )}
        </>
      )}

      <SectionTitle>{t.notifPanelTitle}</SectionTitle>
      {broadcasts.length === 0 ? (
        <Card style={{ textAlign: "center", padding: 24, marginBottom: 14 }}>
          <Bell size={20} color={theme.deep} style={{ margin: "0 auto 8px" }} />
          <div style={{ fontSize: 13, color: C.inkSoft }}>{t.noNotifications}</div>
        </Card>
      ) : (
        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 18 }}>
          {broadcasts.map((b) => (
            <Card key={b.id}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <div style={{ fontWeight: 700, fontSize: 14, color: C.ink }}>{b.title}</div>
                <div style={{ fontSize: 11, color: C.inkFaint }}>{new Date(b.date).toLocaleDateString(lang === "ar" ? "ar-EG" : "en-US")}</div>
              </div>
              <div style={{ fontSize: 13, color: C.inkSoft, marginTop: 6, lineHeight: 1.6 }}>{b.text}</div>
            </Card>
          ))}
        </div>
      )}

      {!isOwner && (
        <>
          <SectionTitle>{t.contactOwnerTitle}</SectionTitle>
          <Card>
            <textarea style={{ ...inputStyle(), minHeight: 70, resize: "vertical", marginBottom: 10 }} placeholder={t.yourMessagePh} value={myMsg} onChange={(e) => setMyMsg(e.target.value)} />
            <PrimaryButton accent={theme.deep} onClick={doSendToOwner}>{t.sendMessage}</PrimaryButton>
          </Card>
        </>
      )}
    </div>
  );
}

/* ============================================================
   PROFILE TAB
   ============================================================ */
function ProfileTab({ t, lang, setLang, journey, setJourney, theme, notif, setNotif, user, onLogout, isOwner }) {
  const name = user?.name || "Sara";
  return (
    <div style={{ padding: "26px 20px 10px" }} className="fade-in">
      <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 26 }}>
        <div style={{ width: 56, height: 56, borderRadius: "50%", background: theme.soft, display: "flex", alignItems: "center", justifyContent: "center" }}>
          <User size={24} color={theme.deep} />
        </div>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <div className="rowaa-serif" style={{ fontSize: 18, fontWeight: 600, color: C.ink }}>{name}</div>
            {isOwner && <Pill tone="beige">{t.ownerBadge}</Pill>}
          </div>
          <div style={{ fontSize: 12.5, color: C.inkSoft }}>{user?.phone}</div>
        </div>
      </div>

      <div style={{ fontSize: 12, fontWeight: 700, color: C.inkFaint, textTransform: "uppercase", letterSpacing: 0.3, marginBottom: 8 }}>{t.myJourney}</div>
      <Card style={{ marginBottom: 22 }}>
        <div style={{ display: "flex", gap: 10 }}>
          {[{ k: "nicu", label: t.nicuTitle }, { k: "home", label: t.homeTitle }, { k: "loss", label: t.lossTitle }].map((j) => (
            <button key={j.k} onClick={() => setJourney(j.k)} style={{ flex: 1, padding: "10px 4px", borderRadius: 14, border: `1.5px solid ${journey === j.k ? theme.deep : C.line}`, background: journey === j.k ? theme.soft : "transparent", fontSize: 11.5, fontWeight: 600, color: journey === j.k ? theme.deep : C.inkSoft, cursor: "pointer" }}>
              {j.label}
            </button>
          ))}
        </div>
      </Card>

      <SettingsRow icon={Globe} label={t.language} value={lang === "en" ? "English" : "العربية"} onClick={() => setLang(lang === "en" ? "ar" : "en")} />
      <SettingsGroup title={t.notifications}>
        <ToggleRow label={t.appointmentReminders} value={notif.appointments} onChange={(v) => setNotif((n) => ({ ...n, appointments: v }))} />
        <ToggleRow label={t.educationalTips} value={notif.tips} onChange={(v) => setNotif((n) => ({ ...n, tips: v }))} />
        <ToggleRow label={t.journalPrompts} value={notif.journal} onChange={(v) => setNotif((n) => ({ ...n, journal: v }))} />
      </SettingsGroup>

      <SettingsRow icon={Shield} label={t.privacy} />
      <SettingsRow icon={MessageCircle} label={t.helpSupport} />
      <SettingsRow icon={LogOut} label={t.logOut} onClick={onLogout} danger />

      <Disclaimer t={t} />
    </div>
  );
}

function SettingsRow({ icon: Icon, label, value, onClick, danger }) {
  return (
    <button onClick={onClick} style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, background: C.card, border: "none", borderRadius: 16, padding: 14, marginBottom: 8, cursor: onClick ? "pointer" : "default" }}>
      <Icon size={17} color={danger ? C.warn : C.inkSoft} />
      <div style={{ flex: 1, textAlign: "start", fontSize: 14, fontWeight: 600, color: danger ? C.warn : C.ink }}>{label}</div>
      {value && <div style={{ fontSize: 12.5, color: C.inkSoft }}>{value}</div>}
    </button>
  );
}

function SettingsGroup({ title, children }) {
  return (
    <div style={{ marginBottom: 8 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: C.inkFaint, textTransform: "uppercase", letterSpacing: 0.3, margin: "14px 2px 8px" }}>{title}</div>
      <Card style={{ padding: 6 }}>{children}</Card>
    </div>
  );
}

function ToggleRow({ label, value, onChange }) {
  return (
    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 8px" }}>
      <div style={{ fontSize: 13.5, color: C.ink }}>{label}</div>
      <button onClick={() => onChange(!value)} style={{ width: 42, height: 24, borderRadius: 999, background: value ? C.sageDeep : C.line, border: "none", position: "relative", cursor: "pointer", transition: "background .15s" }}>
        <span style={{ position: "absolute", top: 3, insetInlineStart: value ? 21 : 3, width: 18, height: 18, borderRadius: "50%", background: "#fff", transition: "inset-inline-start .15s" }} />
      </button>
    </div>
  );
}

const __root = createRoot(document.getElementById("root"));
__root.render(<RowaaApp />);

  </script>
